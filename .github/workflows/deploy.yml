name: Deploy ThreatGraph to AWS EC2

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=========================================="
            echo "Starting Automated Deployment of ThreatGraph"
            echo "=========================================="
            cd ~/ThreatGraph
            
            echo "[1/3] Pulling latest code from GitHub..."
            git fetch origin
            CURRENT_BRANCH=$(git branch --show-current)
            git reset --hard origin/$CURRENT_BRANCH || git pull
            
            echo "[2/3] Rebuilding & Starting Docker Containers..."
            sudo docker compose up -d --build
            
            echo "[3/3] Checking container status..."
            sleep 8
            sudo docker compose ps
            
            echo "=========================================="
            echo "Deployment Completed Successfully! Live at http://${{ secrets.EC2_HOST }}"
            echo "=========================================="
